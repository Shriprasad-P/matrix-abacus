services:
  db:
    image: postgres:16-alpine
    container_name: matrix-abacus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: matrix_abacus
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: matrix
    ports:
      - "5432:5432"
    volumes:
      - matrix-abacus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrix -d matrix_abacus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  matrix-abacus-postgres:

